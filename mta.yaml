_schema-version: 3.3.0
ID: cap-sample
version: 1.0.0
description: "Minimal CAP Node.js sample with Fiori Elements"
parameters:
  enable-parallel-deployments: true
modules:
  - name: cap-sample-srv
    type: nodejs
    path: .
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
      ignore:
        - .git/
        - .vscode/
        - mta_archives/
        - "*_mta_build_tmp"
        - "Makefile_*.mta"
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

resources:
  []
